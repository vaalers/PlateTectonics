name: pt-py310
channels: [conda-forge]
dependencies:
  - python=3.10
  - pandas>=2.0
  - numpy>=1.24
  - openpyxl>=3.1
  - xlsxwriter>=3.2
  - matplotlib>=3.8
  - python-dateutil>=2.8
  - python-pptx>=1.0
  - pillow>=10.0
  - streamlit>=1.50      # graphical interface (pt-gui)
  # dev (optional)
  - pytest>=8
  - ruff>=0.6
  - black>=24.8
  - mypy>=1.11
  # pip section lets us do editable installs
  - pip
  - pip:
      - -e .
